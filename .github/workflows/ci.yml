name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python reference code
        run: python -m compileall -q spikes/native_helper_harness tests
      - name: Validate JSON schema syntax
        run: python -m json.tool schemas/observation-v1.schema.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
