<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CurioTrace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="popup-shell" class="shell" aria-busy="false">
      <header class="brand-row">
        <div>
          <div class="brand">CurioTrace</div>
          <div class="subtitle">Explicit-session browsing trace</div>
        </div>
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
      </header>

      <p id="busy-status" class="busy-status" role="status" aria-live="polite" hidden>Working…</p>

      <section id="session-panel" aria-live="polite">
        <h1 id="state-heading">Checking…</h1>
        <p id="state-detail" class="detail">Reading helper state.</p>
        <p id="error-message" class="error" role="alert" hidden></p>

        <div id="session-actions" class="actions" hidden>
          <button id="start-button" class="primary" type="button" hidden>Start</button>
          <button id="pause-button" type="button" hidden>Pause</button>
          <button id="resume-button" class="primary" type="button" hidden>Resume</button>
          <button id="stop-button" class="danger" type="button" hidden>Stop</button>
          <button id="retry-button" type="button" hidden>Check again</button>
        </div>
      </section>

      <section id="permission-panel" class="permission-panel" hidden aria-live="polite" aria-labelledby="permission-title">
        <h1 id="permission-title" tabindex="-1"></h1>
        <p id="permission-body" class="detail"></p>
        <ul id="permission-points" class="permission-points"></ul>
        <p class="scope-note"><strong>Requested access:</strong> normal HTTP and HTTPS websites.</p>
        <div class="actions vertical">
          <button id="continue-button" class="primary" type="button"></button>
          <button id="cancel-button" type="button"></button>
        </div>
      </section>

      <footer>
        <details id="technical-details" class="technical-details" hidden>
          <summary>Technical details</summary>
          <code id="reason-code" class="reason-code"></code>
        </details>
      </footer>
    </main>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
